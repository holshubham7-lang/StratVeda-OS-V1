name: Deploy frontend

on:
  push:
    branches: [development]
    paths:
      - "app/frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Build
        working-directory: app/frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: https://revops-frontend-dev.azurewebsites.net/backend-api
        run: npm run build

      - name: Trim build output for deployment
        working-directory: app/frontend
        run: |
          rm -rf .next/cache
          npm prune --omit=dev

      - name: Stamp deployed commit
        run: printf '{"commit":"%s"}\n' "$GITHUB_SHA" > app/frontend/public/deployment-version.json

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: revops-frontend-dev
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app/frontend
          clean: true
          restart: true
          startup-command: npm start

      - name: Verify deployed build and footer
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://revops-frontend-dev.azurewebsites.net"
          for attempt in $(seq 1 24); do
            version="$(curl --silent --show-error --fail "$base_url/deployment-version.json?check=$GITHUB_RUN_ID-$attempt" || true)"
            if [[ "$version" == *"$GITHUB_SHA"* ]]; then
              break
            fi
            if [[ "$attempt" == 24 ]]; then
              echo "The development site did not serve commit $GITHUB_SHA after deployment. Last response: $version"
              exit 1
            fi
            sleep 10
          done

          page="$(curl --silent --show-error --fail "$base_url/contact?deploy-check=$GITHUB_RUN_ID")"
          grep -Fq 'Tell us the decision you are working through.' <<< "$page"
          grep -Fq 'Send a message' <<< "$page"
          grep -Fq 'name="message"' <<< "$page"
          grep -Fq 'aria-label="Facebook"' <<< "$page"
          if grep -Fq 'This form is not connected yet' <<< "$page"; then
            echo "The contact page is still serving the old disconnected-form notice."
            exit 1
          fi
          if grep -Fq 'Reach us directly' <<< "$page"; then
            echo "The contact page still contains the retired direct-contact section."
            exit 1
          fi
          if grep -Fq 'mailto:hello@stratvedatech.com' <<< "$page"; then
            echo "The footer still contains the retired email link."
            exit 1
          fi
