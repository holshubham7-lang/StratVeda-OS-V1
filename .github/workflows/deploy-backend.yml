name: Deploy backend API

on:
  push:
    branches: [development]
    paths:
      - "app/backend/api/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-development
  cancel-in-progress: false

jobs:
  deploy-api:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/backend/api/package-lock.json

      - name: Install dependencies
        working-directory: app/backend/api
        run: npm ci

      - name: Build API
        working-directory: app/backend/api
        run: npm run build

      - name: Trim development dependencies
        working-directory: app/backend/api
        run: npm prune --omit=dev

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Package API
        working-directory: app/backend/api
        run: zip -r "$RUNNER_TEMP/api.zip" . -x '*.git*'

      - name: Deploy API to Azure App Service
        run: |
          az webapp deploy \
            --resource-group stratvedaos_group \
            --name revops-api-dev \
            --src-path "$RUNNER_TEMP/api.zip" \
            --type zip \
            --clean true \
            --restart true \
            --track-status true

      - name: Verify API health
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://revops-api-dev.azurewebsites.net"
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail "$base_url/api/health?check=$GITHUB_RUN_ID-$attempt" | grep -Fq '"status":"ok"'; then
              exit 0
            fi
            if [[ "$attempt" == 30 ]]; then
              echo "The API did not return its health response after deployment."
              exit 1
            fi
            sleep 10
          done
